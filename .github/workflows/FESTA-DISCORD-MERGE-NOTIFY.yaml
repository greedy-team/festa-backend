# ===================================================
# FESTA-DISCORD-MERGE-NOTIFY
# ===================================================
#
# develop 으로 PR 이 "머지될 때" 디스코드 채널로 알립니다.
# 닫기만 하고 머지 안 한 PR 은 알리지 않습니다.
#
# 🔑 시크릿: DISCORD_WEBHOOK_URL (저장소 Settings > Secrets and variables > Actions)
#   없으면 경고만 남기고 조용히 건너뜁니다.
#
# ⚠️ 파일명에 PROJECT- 접두어를 쓰지 않습니다.
#   .github/workflows/PROJECT-* 는 `npx projectops` 업데이트에 덮어써집니다 (DOC-0003).
#
# ℹ️ pull_request_target 이 아니라 pull_request 를 씁니다.
#   pull_request_target 은 워크플로우를 "기본 브랜치(main)"에서 읽습니다.
#   이 파일은 develop 에만 있으므로 pull_request_target 으로는 GitHub 이 파일을
#   아예 보지 못해 실행 이력조차 남지 않습니다 (2026-08-25 실측 확인).
#   pull_request 는 PR 브랜치 쪽에서 읽으므로 develop 기준 브랜치에서 동작합니다 —
#   같은 저장소의 PROJECT-COMMON-CLOSE-ISSUE-ON-MERGE 가 같은 방식으로 동작 중입니다.
#
# ⚠️ 포크에서 온 PR 은 시크릿이 내려가지 않아 알림이 가지 않습니다.
#   팀은 같은 저장소 브랜치로 작업하므로 실질 영향은 없고,
#   그런 경우에도 아래 가드가 경고만 남기고 조용히 넘어갑니다.
#
# ===================================================

name: FESTA-DISCORD-MERGE-NOTIFY

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  notify:
    name: 디스코드 알림
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 닫기만 한 PR 은 제외 — 실제로 머지된 것만
    if: ${{ github.event.pull_request.merged == true }}

    permissions:
      contents: read

    steps:
      - name: 웹훅 전송
        env:
          # PR 제목·브랜치명은 사용자 입력이다. ${{ }} 로 run 블록에 넣지 않고
          # 아래에서 $GITHUB_EVENT_PATH 를 jq 로 읽는다.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi

          jq --arg repo "$REPO" '
            .pull_request as $pr
            | {
                embeds: [{
                  title:  (("#" + ($pr.number | tostring) + " " + $pr.title)[0:250]),
                  url:    $pr.html_url,
                  description: ("`" + $pr.head.ref + "` → `" + $pr.base.ref + "`"),
                  color:  3447003,
                  fields: [
                    { name: "작성자", value: ($pr.user.login // "-"),       inline: true },
                    { name: "머지",   value: ($pr.merged_by.login // "-"),  inline: true },
                    { name: "변경",
                      value: (($pr.changed_files | tostring) + "개 파일  "
                              + "+" + ($pr.additions | tostring)
                              + " −" + ($pr.deletions | tostring)),
                      inline: true }
                  ],
                  footer: { text: $repo }
                }]
              }' "$GITHUB_EVENT_PATH" > payload.json

          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"

          echo "디스코드 알림 전송 완료 — ${REPO} PR 머지"
