name: PROJECT-SPRING-CD

on:
  push:
    branches: [develop, main]
    # 문서만 바뀐 push는 배포하지 않는다. 필수 검사인 CI에는 경로 제외를 넣지 않는다.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG.json'
  # 새 인스턴스의 최초 배포나 동일 코드 재배포는 경로 필터 없이 수동 실행한다.
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: OCI 배포
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
    permissions:
      contents: read
      packages: write
    env:
      TARGET_PLATFORM: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development')) == 'production' && 'linux/arm64' || 'linux/amd64' }}
      OCI_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/festa' }}

    steps:
      - name: 배포 환경 활성화 확인
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "선택한 GitHub Environment의 DEPLOY_ENABLED가 true가 아닙니다." >&2
            exit 1
          fi

      - name: 코드 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: GHCR 설정 확인과 이미지 이름 준비
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_READ_TOKEN" ]]; then
            echo "GHCR_USERNAME과 GHCR_READ_TOKEN(read:packages) Secret이 필요합니다." >&2
            exit 1
          fi
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          architecture="${TARGET_PLATFORM#linux/}"
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA-$architecture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: GHCR 업로드 인증
        env:
          GHCR_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_PUSH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 실행 JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: QEMU 설정
        if: ${{ env.TARGET_PLATFORM == 'linux/arm64' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 컨테이너 이미지 빌드와 GHCR 업로드
        run: |
          # build/는 .dockerignore에서 제외하므로 산출물만 별도 컨텍스트로 전달한다.
          image_context="$RUNNER_TEMP/image-context"
          mkdir -p "$image_context"
          cp Dockerfile "$image_context/Dockerfile"
          jar_file="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')"
          cp "$jar_file" "$image_context/app.jar"
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$IMAGE_NAME:buildcache-${TARGET_PLATFORM#linux/}" \
            --cache-to "type=registry,ref=$IMAGE_NAME:buildcache-${TARGET_PLATFORM#linux/},mode=max" \
            --push \
            "$image_context"

      - name: SSH와 실행 환경 준비
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST_KEY: ${{ secrets.OCI_HOST_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AES_KEY: ${{ secrets.AES_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_INITIAL_USERNAME: ${{ secrets.ADMIN_INITIAL_USERNAME }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          if [[ "$DB_URL" != "jdbc:postgresql://postgres:5432/festa" ]]; then
            echo "DB_URL은 jdbc:postgresql://postgres:5432/festa와 정확히 일치해야 합니다." >&2
            exit 1
          fi
          if [[ -z "$OCI_HOST_KEY" ]]; then
            echo "OCI_HOST_KEY Secret에 미리 검증한 서버 host key를 등록해야 합니다." >&2
            exit 1
          fi
          if [[ -z "$ADMIN_JWT_SECRET" ]]; then
            echo "ADMIN_JWT_SECRET Secret이 없습니다. 앱이 기동하지 못합니다." >&2
            exit 1
          fi
          if [[ -n "$ADMIN_INITIAL_USERNAME" && -z "$ADMIN_INITIAL_PASSWORD" ]]; then
            echo "ADMIN_INITIAL_USERNAME만 설정되어 있습니다. ADMIN_INITIAL_PASSWORD도 등록하거나 둘 다 비워야 합니다." >&2
            exit 1
          fi
          if [[ -z "$ADMIN_INITIAL_USERNAME" && -n "$ADMIN_INITIAL_PASSWORD" ]]; then
            echo "ADMIN_INITIAL_PASSWORD만 설정되어 있습니다. ADMIN_INITIAL_USERNAME도 등록하거나 둘 다 비워야 합니다." >&2
            exit 1
          fi

          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$OCI_HOST_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

          umask 077
          write_env() {
            local key="$1"
            local value="$2"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value"
          }
          {
            write_env SPRING_PROFILES_ACTIVE "$DEPLOY_ENVIRONMENT"
            write_env DB_URL "$DB_URL"
            write_env DB_USERNAME "$DB_USERNAME"
            write_env DB_PASSWORD "$DB_PASSWORD"
            write_env JWT_SECRET "$JWT_SECRET"
            write_env AES_KEY "$AES_KEY"
            write_env ADMIN_JWT_SECRET "$ADMIN_JWT_SECRET"
            write_env ADMIN_INITIAL_USERNAME "$ADMIN_INITIAL_USERNAME"
            write_env ADMIN_INITIAL_PASSWORD "$ADMIN_INITIAL_PASSWORD"
          } > "$RUNNER_TEMP/app.env"

      - name: OCI에서 비공개 이미지 다운로드
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          # 토큰은 SSH 표준 입력으로만 전달한다. 인증 파일은 pull 뒤 삭제한다.
          # 이 단계가 실패하면 실행 중인 앱과 서버 설정을 바꾸지 않는다.
          printf -v remote_command '%q ' bash -c "$(cat deploy/pull-image.sh)" -- "$GHCR_USERNAME" "$IMAGE_NAME:$IMAGE_TAG"
          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "$remote_command"

      - name: OCI 인스턴스로 설정 전송
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "mkdir -p '$OCI_DEPLOY_PATH'"
          scp \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -P "$OCI_PORT" \
            "$RUNNER_TEMP/app.env" \
            deploy/compose.yaml \
            deploy/Caddyfile \
            "$OCI_USER@$OCI_HOST:$OCI_DEPLOY_PATH/"

      - name: 컨테이너 재기동
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$OCI_DEPLOY_PATH"
          chmod 600 app.env
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          if [[ ! -s .last-successful-image ]]; then
            current_container="$(APP_IMAGE="$IMAGE_NAME:$IMAGE_TAG" docker compose --env-file app.env ps -q app)"
            if [[ -n "$current_container" ]]; then
              docker inspect --format '{{.Config.Image}}' "$current_container" > .last-successful-image
            fi
          fi
          printf '%s\n' "$IMAGE_NAME:$IMAGE_TAG" > .deployment-in-progress

          if ! APP_IMAGE="$IMAGE_NAME:$IMAGE_TAG" docker compose --env-file app.env up -d --wait --wait-timeout 300 \
            || ! curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              http://localhost:8080/actuator/health; then
            # 롤백하면 실패한 컨테이너가 사라져 원인이 영영 남지 않는다. 되돌리기 전에 찍는다.
            # APP_IMAGE를 다시 넘기는 이유는 compose.yaml이 이 값을 필수로 선언해서,
            # 주지 않으면 logs가 그 자리에서 죽기 때문이다.
            echo "=== 실패한 앱 컨테이너 로그 (마지막 200줄) ===" >&2
            APP_IMAGE="$IMAGE_NAME:$IMAGE_TAG" docker compose --env-file app.env logs --tail=200 --no-color app >&2 || true
            previous_image="$(cat .last-successful-image 2>/dev/null || true)"
            if [[ -z "$previous_image" ]] || ! docker image inspect "$previous_image" >/dev/null 2>&1; then
              echo "배포 실패: 롤백할 이전 정상 이미지가 없습니다." >&2
              rm -f .deployment-in-progress
              exit 1
            fi

            echo "새 이미지 배포 실패. $previous_image 로 롤백합니다." >&2
            APP_IMAGE="$previous_image" docker compose --env-file app.env up -d --wait --wait-timeout 300
            curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              http://localhost:8080/actuator/health
            rm -f .deployment-in-progress
            exit 1
          fi
          REMOTE

      - name: HTTPS 서빙 확인
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://api.every-festa.com' }}
        run: |
          # 실제 서비스 경로는 도메인 → 앞단(TLS 종단) → app:8080이다. 8080만 보면
          # 인증서 발급 실패나 443 차단을 배포 성공으로 넘겨버린다.
          # 앱 8080은 루프백에만 묶여 있어 러너에서 직접 부를 수 없다 —
          # 밖에서 하는 확인은 이 스텝 하나다.
          # 첫 배포에서는 인증서를 받아오는 시간이 필요해 넉넉히 재시도한다.
          if ! curl --fail --silent --show-error \
            --retry 15 --retry-delay 4 --retry-all-errors --connect-timeout 10 \
            "$PUBLIC_BASE_URL/actuator/health"; then
            echo "HTTPS 서빙 확인 실패: $PUBLIC_BASE_URL 에 인증서 경고 없이 닿지 못했습니다." >&2
            echo "앱 이미지는 되돌리지 않습니다 — 앱이 아니라 앞단 문제라 롤백해도 고쳐지지 않습니다." >&2
            echo "서버에서 'docker compose --env-file app.env logs caddy'로 발급 로그를 확인하세요." >&2
            exit 1
          fi

      - name: 정상 배포 이미지 기록과 정리
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' EXPECTED_IMAGE='$IMAGE_NAME:$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$OCI_DEPLOY_PATH"
          deploying_image="$(cat .deployment-in-progress 2>/dev/null || true)"
          if [[ "$deploying_image" != "$EXPECTED_IMAGE" ]]; then
            echo "배포 상태가 예상과 달라 정상 이미지로 기록하지 않습니다." >&2
            exit 1
          fi
          previous_image="$(cat .last-successful-image 2>/dev/null || true)"
          printf '%s\n' "$EXPECTED_IMAGE" > .last-successful-image
          rm -f .deployment-in-progress

          while IFS= read -r image; do
            if [[ -z "$image" || "$image" == "$EXPECTED_IMAGE" || "$image" == "$previous_image" ]]; then
              continue
            fi
            docker image rm "$image" || true
          # 첫 GHCR 배포에서 이전 festa-backend:<sha>도 보존하고, 다음 성공 때 정리한다.
          done < <(docker image ls --filter "reference=$IMAGE_NAME:*" --filter 'reference=festa-backend:*' --format '{{.Repository}}:{{.Tag}}')
          REMOTE

      - name: GHCR 업로드 인증 정리
        if: always()
        run: docker logout ghcr.io
