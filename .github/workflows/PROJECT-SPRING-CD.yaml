name: PROJECT-SPRING-CD

on:
  push:
    branches: [develop, main]
    # 문서만 바뀐 push는 배포하지 않는다. 필수 검사인 CI에는 경로 제외를 넣지 않는다.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG.json'
  # 새 인스턴스의 최초 배포나 동일 코드 재배포는 경로 필터 없이 수동 실행한다.
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: OCI 배포
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
    permissions:
      contents: read
      packages: write
    env:
      TARGET_PLATFORM: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development')) == 'production' && 'linux/arm64' || 'linux/amd64' }}
      OCI_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
      OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH || '/opt/festa' }}

    steps:
      - name: 배포 환경 활성화 확인
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "선택한 GitHub Environment의 DEPLOY_ENABLED가 true가 아닙니다." >&2
            exit 1
          fi

      - name: 코드 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: GHCR 설정 확인과 이미지 이름 준비
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_READ_TOKEN" ]]; then
            echo "GHCR_USERNAME과 GHCR_READ_TOKEN(read:packages) Secret이 필요합니다." >&2
            exit 1
          fi
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          architecture="${TARGET_PLATFORM#linux/}"
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA-$architecture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: GHCR 업로드 인증
        env:
          GHCR_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_PUSH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 실행 JAR 빌드
        run: ./gradlew bootJar --no-daemon

      - name: QEMU 설정
        if: ${{ env.TARGET_PLATFORM == 'linux/arm64' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 컨테이너 이미지 빌드와 GHCR 업로드
        run: |
          # build/는 .dockerignore에서 제외하므로 산출물만 별도 컨텍스트로 전달한다.
          image_context="$RUNNER_TEMP/image-context"
          mkdir -p "$image_context"
          cp Dockerfile "$image_context/Dockerfile"
          jar_file="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')"
          cp "$jar_file" "$image_context/app.jar"
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$IMAGE_NAME:buildcache-${TARGET_PLATFORM#linux/}" \
            --cache-to "type=registry,ref=$IMAGE_NAME:buildcache-${TARGET_PLATFORM#linux/},mode=max" \
            --push \
            "$image_context"

      - name: SSH와 실행 환경 준비
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST_KEY: ${{ secrets.OCI_HOST_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AES_KEY: ${{ secrets.AES_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_INITIAL_USERNAME: ${{ secrets.ADMIN_INITIAL_USERNAME }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          GRAFANA_OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
          API_DOMAINS: ${{ vars.API_DOMAINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          # 서버에 닿기 전에 막는다. compose가 이 값을 필수로 선언해서, 비어 있으면
          # 컨테이너 재기동과 롤백이 둘 다 같은 자리에서 죽는다.
          if [[ -z "${API_DOMAINS//[[:space:],]/}" ]]; then
            echo "API_DOMAINS Variable에 Caddy가 서빙할 도메인을 등록해야 합니다. 예: api.every-festa.com" >&2
            exit 1
          fi
          # Caddy는 "쉼표+공백"으로 주소를 나눈다. "a,b"는 잘못된 주소 하나로, 끝 쉼표는 파싱 오류로
          # 읽혀 운영 트래픽을 받는 서버의 caddy가 재시작을 반복한다.
          if [[ "$API_DOMAINS" =~ ,[^[:space:]] || "$API_DOMAINS" =~ ,[[:space:]]*$ ]]; then
            echo "API_DOMAINS는 쉼표 뒤에 공백을 두고 끝에 쉼표가 없어야 합니다. 예: api.every-festa.com, dev-api.every-festa.com" >&2
            exit 1
          fi
          # 마지막 HTTPS 확인에서 형식 오류가 걸리면 컨테이너를 이미 바꾼 뒤이고, 첫 운영 배포의
          # 정상적인 실패(도메인이 아직 다른 서버를 가리킴)와 구별되지 않는다. 그래서 여기서 먼저 막는다.
          if [[ ! "$PUBLIC_BASE_URL" =~ ^https://([A-Za-z0-9.-]+)$ ]]; then
            echo "PUBLIC_BASE_URL Variable은 경로 없는 https://<도메인> 형식이어야 합니다: '$PUBLIC_BASE_URL'" >&2
            exit 1
          fi
          # 형식이 각각 맞아도 두 값이 서로 다른 도메인일 수 있다. HTTPS 확인은 PUBLIC_BASE_URL의 도메인으로
          # 접속하므로, Caddy가 서빙하지 않는 도메인이면 위와 같은 이유로 컨테이너를 바꾼 뒤에야 구별되지 않는
          # 실패가 난다. API_DOMAINS를 쉼표·공백으로 나눈 도메인 하나와 정확히 같아야 하고, 대소문자는 가리지 않는다.
          public_host="${BASH_REMATCH[1],,}"
          public_host_served=false
          read -ra api_domains <<< "${API_DOMAINS//,/ }"
          for api_domain in "${api_domains[@]}"; do
            if [[ "${api_domain,,}" == "$public_host" ]]; then
              public_host_served=true
            fi
          done
          if [[ "$public_host_served" != true ]]; then
            echo "PUBLIC_BASE_URL의 도메인($public_host)이 API_DOMAINS에 없습니다: '$API_DOMAINS'. 두 Variable을 같은 도메인으로 맞춰야 합니다." >&2
            exit 1
          fi
          if [[ "$DB_URL" != "jdbc:postgresql://postgres:5432/festa" ]]; then
            echo "DB_URL은 jdbc:postgresql://postgres:5432/festa와 정확히 일치해야 합니다." >&2
            exit 1
          fi
          if [[ -z "$OCI_HOST_KEY" ]]; then
            echo "OCI_HOST_KEY Secret에 미리 검증한 서버 host key를 등록해야 합니다." >&2
            exit 1
          fi
          if [[ -z "$ADMIN_JWT_SECRET" ]]; then
            echo "ADMIN_JWT_SECRET Secret이 없습니다. 앱이 기동하지 못합니다." >&2
            exit 1
          fi
          if [[ -n "$ADMIN_INITIAL_USERNAME" && -z "$ADMIN_INITIAL_PASSWORD" ]]; then
            echo "ADMIN_INITIAL_USERNAME만 설정되어 있습니다. ADMIN_INITIAL_PASSWORD도 등록하거나 둘 다 비워야 합니다." >&2
            exit 1
          fi
          if [[ -z "$ADMIN_INITIAL_USERNAME" && -n "$ADMIN_INITIAL_PASSWORD" ]]; then
            echo "ADMIN_INITIAL_PASSWORD만 설정되어 있습니다. ADMIN_INITIAL_USERNAME도 등록하거나 둘 다 비워야 합니다." >&2
            exit 1
          fi

          # 텔레메트리 비밀은 없어도 앱이 뜬다. 그러나 형식이 깨진 값은 서버에 닿기 전에 막는다.
          # 원문을 먼저 검사한다 — base64 -d는 줄바꿈이 섞인 입력도 통과시킨다.
          if [[ -n "$GRAFANA_OTLP_AUTH" ]]; then
            if [[ ! "$GRAFANA_OTLP_AUTH" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
              echo "GRAFANA_OTLP_AUTH에 공백·줄바꿈이 있거나 base64가 아닙니다." >&2
              exit 1
            fi
            decoded="$(printf '%s' "$GRAFANA_OTLP_AUTH" | base64 -d 2>/dev/null; printf x)"
            decoded="${decoded%x}"
            if [[ ! "$decoded" =~ ^[0-9]+:glc_[^[:space:]]+$ ]]; then
              echo "GRAFANA_OTLP_AUTH는 <instanceId>:<glc 토큰>을 인코딩한 값이어야 합니다." >&2
              exit 1
            fi
            unset decoded
          else
            echo "::warning::GRAFANA_OTLP_AUTH가 비어 있습니다. 배포는 계속되지만 메트릭은 전송되지 않습니다."
          fi

          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$OCI_HOST_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

          umask 077
          write_env() {
            local key="$1"
            local value="$2"
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value"
          }
          {
            write_env SPRING_PROFILES_ACTIVE "$DEPLOY_ENVIRONMENT"
            write_env DB_URL "$DB_URL"
            write_env DB_USERNAME "$DB_USERNAME"
            write_env DB_PASSWORD "$DB_PASSWORD"
            write_env JWT_SECRET "$JWT_SECRET"
            write_env AES_KEY "$AES_KEY"
            write_env ADMIN_JWT_SECRET "$ADMIN_JWT_SECRET"
            write_env GRAFANA_OTLP_AUTH "$GRAFANA_OTLP_AUTH"
            write_env ADMIN_INITIAL_USERNAME "$ADMIN_INITIAL_USERNAME"
            write_env ADMIN_INITIAL_PASSWORD "$ADMIN_INITIAL_PASSWORD"
            write_env API_DOMAINS "$API_DOMAINS"
          } > "$RUNNER_TEMP/app.env"

      - name: OCI에서 비공개 이미지 다운로드
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          # 토큰은 SSH 표준 입력으로만 전달한다. 인증 파일은 pull 뒤 삭제한다.
          # 이 단계가 실패하면 실행 중인 앱과 서버 설정을 바꾸지 않는다.
          printf -v remote_command '%q ' bash -c "$(cat deploy/pull-image.sh)" -- "$GHCR_USERNAME" "$IMAGE_NAME:$IMAGE_TAG"
          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "$remote_command"

      - name: OCI 인스턴스로 설정 전송
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "mkdir -p '$OCI_DEPLOY_PATH'"
          scp \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -P "$OCI_PORT" \
            "$RUNNER_TEMP/app.env" \
            deploy/compose.yaml \
            deploy/Caddyfile \
            deploy/switch-back.sh \
            "$OCI_USER@$OCI_HOST:$OCI_DEPLOY_PATH/"

      - name: 컨테이너 재기동
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          # 값이 overlap이면 새 색을 먼저 띄운다(운영, 끊김 없음).
          # 비어 있으면 순차다 — 옛 색을 먼저 멈춘다. 1GB 개발 서버에 JVM이 둘 뜨지 않는다.
          DEPLOY_STRATEGY: ${{ vars.DEPLOY_STRATEGY }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' DEPLOY_STRATEGY='$DEPLOY_STRATEGY' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$OCI_DEPLOY_PATH"
          chmod 600 app.env
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
          new_image="$IMAGE_NAME:$IMAGE_TAG"

          # compose.yaml이 APP_IMAGE를 필수로 선언해서, 어떤 하위 명령이든 값을 줘야 그 자리에서 죽지 않는다.
          run_compose() { APP_IMAGE="$1" docker compose --env-file app.env "${@:2}"; }
          port_of() { case "$1" in app-blue) echo 8081 ;; app-green) echo 8082 ;; *) echo 8080 ;; esac; }

          # 첫 전환 전의 기존 app은 compose.yaml에 없어 라벨로만 찾는다. 서비스 이름 라벨만 보면
          # 같은 서버의 다른 compose 프로젝트에 있는 app까지 멈추고 지운다 — 이 배포 경로의 프로젝트로 좁힌다.
          # 이름은 compose가 실제로 쓰는 값을 그대로 받는다. 경로에서 따로 추측하지 않는다.
          # compose는 숫자처럼 보이는 이름을 따옴표로 감싸 내므로 벗긴다.
          compose_project="$(run_compose "$new_image" config | sed -n '/^name: /{s/^name: //;s/^"\(.*\)"$/\1/;p;}' || true)"
          if [[ -z "$compose_project" ]]; then
            echo "compose 프로젝트 이름을 읽지 못했습니다. 기존 app 컨테이너를 가려낼 수 없어 컨테이너와 트래픽을 바꾸기 전에 멈춥니다(설정 파일은 이미 전송됨)." >&2
            exit 1
          fi
          legacy_filter=(--filter "label=com.docker.compose.project=$compose_project" --filter 'label=com.docker.compose.service=app')

          stop_service() {
            # 첫 전환 전의 기존 app은 compose.yaml에 더 이상 없다. 라벨로 찾아 직접 멈춘다.
            if [[ "$1" == app ]]; then
              local legacy
              legacy="$(docker ps -q "${legacy_filter[@]}")"
              if [[ -n "$legacy" ]]; then
                docker stop --time 40 $legacy >/dev/null || true
              fi
            else
              run_compose "$new_image" stop --timeout 40 "$1" || true
            fi
          }
          restore_current_service() {
            # 첫 전환 전의 기존 app은 compose.yaml에 없다. 멈춰 둔 그 컨테이너를 그대로 되살린다.
            if [[ "$current_service" == app ]]; then
              local legacy
              legacy="$(docker ps -aq "${legacy_filter[@]}")"
              if [[ -n "$legacy" ]]; then
                docker start $legacy >/dev/null
              fi
            else
              run_compose "$previous_image" up -d --wait --wait-timeout 300 "$current_service"
            fi
          }

          # 트래픽을 받는 색은 CD가 덮지 않는 서버 상태다. 없으면 첫 전환이라 기존 app을 현재 색으로 취급한다.
          mkdir -p upstream
          if [[ ! -s upstream/active.caddy ]]; then
            printf 'reverse_proxy app:8080\n' > upstream/active.caddy
          fi
          if grep -q 'app-blue' upstream/active.caddy; then
            current_service=app-blue
            target_service=app-green
          elif grep -q 'app-green' upstream/active.caddy; then
            current_service=app-green
            target_service=app-blue
          else
            current_service=app
            target_service=app-blue
          fi
          target_port="$(port_of "$target_service")"
          current_port="$(port_of "$current_service")"
          overlap=false
          if [[ "${DEPLOY_STRATEGY:-}" == overlap ]]; then
            overlap=true
          fi

          if [[ ! -s .last-successful-image ]]; then
            # 기존 app은 compose.yaml에 없으므로 compose ps로 물으면 'no such service'로 죽는다.
            if [[ "$current_service" == app ]]; then
              current_container="$(docker ps -q "${legacy_filter[@]}")"
            else
              current_container="$(run_compose "$new_image" ps -q "$current_service")"
            fi
            if [[ -n "$current_container" ]]; then
              docker inspect --format '{{.Config.Image}}' "$current_container" > .last-successful-image
            fi
          fi
          previous_image="$(cat .last-successful-image 2>/dev/null || true)"
          printf '%s\n' "$new_image" > .deployment-in-progress

          # 앞단과 DB는 색과 무관하게 떠 있어야 한다. upstream 파일을 만든 뒤에 올린다 —
          # Caddy는 불러올 파일이 없으면 뜨지 못한다.
          run_compose "$new_image" up -d postgres caddy

          # 순차(개발)는 JVM을 하나만 띄우려고 옛 색을 먼저 멈춘다. 겹침(운영)은 그대로 둔다.
          if [[ "$overlap" != true ]]; then
            stop_service "$current_service"
          fi

          # 두 번 확인한다. 서버의 루프백 포트로 한 번, Caddy 컨테이너 안에서 한 번 —
          # 뒤쪽은 Caddy가 실제로 붙을 이름과 네트워크를 확인한다.
          # exec는 -T여도 stdin을 컨테이너로 넘긴다. 이 스크립트는 ssh의 bash -s가 stdin에서 읽으므로
          # </dev/null이 없으면 exec가 남은 스크립트를 먹고, 전환 없이 성공(0)으로 끝난다.
          if ! run_compose "$new_image" up -d --wait --wait-timeout 300 "$target_service" \
            || ! curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              "http://localhost:$target_port/actuator/health" \
            || ! run_compose "$new_image" exec -T caddy \
              wget -q -O /dev/null "http://$target_service:8080/actuator/health" </dev/null; then
            # 되돌리면 실패한 컨테이너가 사라져 원인이 영영 남지 않는다. 멈추기 전에 찍는다.
            echo "=== 실패한 앱 컨테이너 로그 (마지막 200줄) ===" >&2
            run_compose "$new_image" logs --tail=200 --no-color "$target_service" >&2 || true
            stop_service "$target_service"

            if [[ "$overlap" == true ]]; then
              # Caddy를 건드리기 전이라 트래픽은 옛 색 그대로다. 되돌릴 것이 없다.
              echo "새 색 기동 실패. 트래픽은 $current_service 그대로입니다." >&2
              rm -f .deployment-in-progress
              exit 1
            fi

            if [[ -z "$previous_image" ]] || ! docker image inspect "$previous_image" >/dev/null 2>&1; then
              echo "배포 실패: 롤백할 이전 정상 이미지가 없습니다." >&2
              rm -f .deployment-in-progress
              exit 1
            fi
            echo "새 이미지 배포 실패. $previous_image 로 롤백합니다." >&2
            restore_current_service
            # 첫 전환 롤백은 docker start라 기동을 기다리지 않는다. 앱이 뜨는 동안 포트는 열려
            # 있어도 응답이 없어 curl이 52(empty reply)로 떨어지므로 그 오류에도 재시도한다.
            # 기다리는 시간은 다른 롤백 경로의 --wait-timeout 300과 같다. 개발 서버 기동이 128~190초라
            # 60초만 기다리면 되살아나는 중인 앱을 롤백 실패로 판정한다. --retry-max-time은 진행 중인
            # 요청을 끊지 못하므로, 연결은 받고 답하지 않는 앱에 묶이지 않게 요청마다 상한을 둔다.
            curl --fail --silent --show-error --retry 100 --retry-delay 3 --retry-max-time 300 \
              --connect-timeout 5 --max-time 10 --retry-all-errors --retry-connrefused \
              "http://localhost:$current_port/actuator/health"
            rm -f .deployment-in-progress
            exit 1
          fi

          # 전환. reload는 진행 중 연결을 끊지 않고, 설정이 틀리면 Caddy가 기존 설정을 유지한다.
          cp upstream/active.caddy .active.caddy.previous
          printf 'reverse_proxy %s:8080\n' "$target_service" > upstream/active.caddy
          if ! run_compose "$new_image" exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null; then
            echo "Caddy reload 실패. 트래픽 대상을 되돌립니다." >&2
            mv .active.caddy.previous upstream/active.caddy
            stop_service "$target_service"
            if [[ "$overlap" != true && -n "$previous_image" ]] && docker image inspect "$previous_image" >/dev/null 2>&1; then
              restore_current_service
            fi
            rm -f .deployment-in-progress
            exit 1
          fi
          rm -f .active.caddy.previous

          # 겹침(운영)은 전환 뒤에 옛 색을 멈춘다. 지우지 않는다 — switch-back.sh가 그 컨테이너를 되살린다.
          if [[ "$overlap" == true ]]; then
            stop_service "$current_service"
          fi
          REMOTE

      - name: HTTPS 서빙 확인
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          # 실제 서비스 경로는 도메인 → 앞단(TLS 종단) → app:8080이다. 8080만 보면
          # 인증서 발급 실패나 443 차단을 배포 성공으로 넘겨버린다.
          # 앱 8080은 루프백에만 묶여 있어 러너에서 직접 부를 수 없다 —
          # 밖에서 하는 확인은 이 스텝 하나다.
          # 첫 배포에서는 인증서를 받아오는 시간이 필요해 넉넉히 재시도한다.
          # 접속은 방금 배포한 OCI_HOST로 고정한다. DNS를 따르면 도메인이 아직 다른 서버를
          # 가리킬 때 그 서버의 200으로 성공 처리된다. 인증서·SNI 검증은 도메인 기준 그대로다.
          if [[ ! "$PUBLIC_BASE_URL" =~ ^https://([A-Za-z0-9.-]+)$ ]]; then
            echo "PUBLIC_BASE_URL Variable은 경로 없는 https://<도메인> 형식이어야 합니다: '$PUBLIC_BASE_URL'" >&2
            exit 1
          fi
          public_host="${BASH_REMATCH[1]}"
          if ! curl --fail --silent --show-error \
            --retry 15 --retry-delay 4 --retry-all-errors --connect-timeout 10 \
            --connect-to "$public_host:443:$OCI_HOST:443" \
            "$PUBLIC_BASE_URL/actuator/health"; then
            echo "HTTPS 서빙 확인 실패: $OCI_HOST 에서 $PUBLIC_BASE_URL 을 인증서 경고 없이 서빙하지 못했습니다." >&2
            echo "도메인이 아직 다른 서버를 가리키면 인증서를 받을 수 없어 이 단계는 실패하는 것이 정상입니다." >&2
            echo "앱 이미지는 되돌리지 않습니다 — 앱이 아니라 앞단 문제라 롤백해도 고쳐지지 않습니다." >&2
            echo "서버에서 'docker logs festa-caddy-1'(기본 배포 경로 /opt/festa 기준)로 발급 로그를 확인하세요." >&2
            exit 1
          fi

      - name: 정상 배포 이미지 기록과 정리
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            "OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' EXPECTED_IMAGE='$IMAGE_NAME:$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$OCI_DEPLOY_PATH"
          deploying_image="$(cat .deployment-in-progress 2>/dev/null || true)"
          if [[ "$deploying_image" != "$EXPECTED_IMAGE" ]]; then
            echo "배포 상태가 예상과 달라 정상 이미지로 기록하지 않습니다." >&2
            exit 1
          fi
          previous_image="$(cat .last-successful-image 2>/dev/null || true)"
          printf '%s\n' "$EXPECTED_IMAGE" > .last-successful-image
          # switch-back.sh가 되돌릴 대상이다. 옛 색 컨테이너가 사라진 뒤에도 이름은 남는다.
          if [[ -n "$previous_image" ]]; then
            printf '%s\n' "$previous_image" > .previous-successful-image
          fi
          rm -f .deployment-in-progress

          # 첫 전환으로 색 서비스가 트래픽을 받은 뒤라 기존 app 컨테이너는 더 필요 없다.
          # HTTPS 확인까지 통과한 뒤에만 여기 닿는다. 다른 compose 프로젝트의 app은 건드리지 않도록
          # 이 배포 경로의 프로젝트로 좁힌다. 성공 기록은 이미 끝났으므로 이름을 못 읽으면 정리만 건너뛴다.
          compose_project="$(APP_IMAGE="$EXPECTED_IMAGE" docker compose --env-file app.env config | sed -n '/^name: /{s/^name: //;s/^"\(.*\)"$/\1/;p;}' || true)"
          if [[ -z "$compose_project" ]]; then
            echo "compose 프로젝트 이름을 읽지 못해 기존 app 컨테이너 정리를 건너뜁니다." >&2
          else
            legacy_container="$(docker ps -aq --filter "label=com.docker.compose.project=$compose_project" --filter 'label=com.docker.compose.service=app')"
            if [[ -n "$legacy_container" ]]; then
              docker rm -f $legacy_container >/dev/null || true
            fi
          fi

          while IFS= read -r image; do
            if [[ -z "$image" || "$image" == "$EXPECTED_IMAGE" || "$image" == "$previous_image" ]]; then
              continue
            fi
            docker image rm "$image" || true
          # 첫 GHCR 배포에서 이전 festa-backend:<sha>도 보존하고, 다음 성공 때 정리한다.
          done < <(docker image ls --filter "reference=$IMAGE_NAME:*" --filter 'reference=festa-backend:*' --format '{{.Repository}}:{{.Tag}}')
          REMOTE

      - name: GHCR 업로드 인증 정리
        if: always()
        run: docker logout ghcr.io
