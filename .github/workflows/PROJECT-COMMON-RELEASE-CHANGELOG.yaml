# ===================================================================
# PROJECT-COMMON-RELEASE-CHANGELOG.yaml
# 릴리스 준비 + 체인지로그 관리 워크플로우
# ===================================================================
#
# main 대상 develop 릴리스 PR이 열리면 다음 순서로 처리합니다.
# 1. 릴리스 노트를 만들고 patch 버전·CHANGELOG·README를 갱신합니다.
# 2. 변경을 임시 브랜치에 커밋한 뒤 develop 대상 준비 PR로 검증·병합합니다.
# 3. 갱신된 develop→main PR의 필수 검사를 기다린 뒤 정상 PR 병합합니다.
# 4. 병합된 main 커밋에 버전 태그를 생성합니다.
#
# main/develop 보호 규칙을 우회하지 않습니다. 두 보호 브랜치에는 직접 push하지
# 않고, 릴리스 준비 브랜치만 push합니다.
#
# changelog provider는 version.yml의 options.changelog.provider를 사용합니다.
# coderabbit은 PR Summary를 기다리고, 실패하거나 다른 provider가 설정된 경우
# .github/scripts/changelog_providers/ladder.py의 provider 사다리를 사용합니다.
#
# 필수 secret: _GITHUB_PAT_TOKEN (contents/pull requests 권한)
# GITHUB_TOKEN으로 만든 PR은 후속 workflow를 트리거하지 않으므로 PAT가 필요합니다.
# ===================================================================

name: RELEASE CHANGELOG

on:
  pull_request_target:
    types: [opened]
    branches: ["main"]
  push:
    branches: ["main"]
    paths: ["version.yml"]

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  models: read

jobs:
  release:
    name: 릴리스 준비 및 배포
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: develop 체크아웃
        uses: actions/checkout@v5
        with:
          token: ${{ secrets._GITHUB_PAT_TOKEN }}
          fetch-depth: 0
          ref: develop

      - name: 릴리스 준비 PR 생성 및 main 병합
        env:
          GH_TOKEN: ${{ secrets._GITHUB_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          wait_required_checks() {
            local pr_number="$1"
            local checks=""

            for attempt in $(seq 1 100); do
              checks=$(gh pr checks "$pr_number" --required --json name,bucket 2>/dev/null || true)
              # main에는 필수 검사 ruleset이 없으므로 동일한 Spring CI를 명시적으로 기다린다.
              if ! echo "$checks" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
                checks=$(gh pr checks "$pr_number" --json name,bucket --jq 'map(select(.name == "빌드 검증"))' 2>/dev/null || true)
              fi
              if echo "$checks" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
                if echo "$checks" | jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel" or .bucket == "skipping")' >/dev/null; then
                  echo "❌ PR #$pr_number 검사 실패·취소·건너뜀"
                  return 1
                fi
                if echo "$checks" | jq -e 'all(.[]; .bucket == "pass")' >/dev/null; then
                  return 0
                fi
              fi
              echo "[$attempt/100] PR #$pr_number 검사 통과 대기 중..."
              sleep 10
            done

            echo "❌ PR #$pr_number 검사 등록 또는 완료 시간 초과"
            return 1
          }

          get_version() {
            grep '^version:' "$1" | sed 's/version: *"\([^"]*\)".*/\1/'
          }

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main develop

          PREP_BRANCH="release-prep-${RELEASE_PR}"
          PREP_PR=$(gh pr list \
            --state open \
            --base develop \
            --head "$PREP_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          # 이전 실행이 준비 PR까지만 만들었다면 새 버전을 만들지 않고 이어서 병합합니다.
          if [ -n "$PREP_PR" ]; then
            echo "ℹ️ 기존 릴리스 준비 PR #$PREP_PR을 이어서 처리합니다"
            PREP_HEAD=$(gh pr view "$PREP_PR" --json headRefOid --jq .headRefOid)
            wait_required_checks "$PREP_PR"
            gh pr merge "$PREP_PR" --merge --delete-branch --match-head-commit "$PREP_HEAD"
            git fetch origin develop
            git switch --detach origin/develop
          fi

          DEVELOP_VERSION=$(get_version version.yml)
          git show origin/main:version.yml > /tmp/main-version.yml
          MAIN_VERSION=$(get_version /tmp/main-version.yml)
          VERSION="$DEVELOP_VERSION"

          if [ "$DEVELOP_VERSION" != "$MAIN_VERSION" ]; then
            # 준비가 끝난 재실행인지 검증합니다. 버전만 어긋난 상태는 릴리스하지 않습니다.
            jq -e --arg version "$DEVELOP_VERSION" '.releases[0].version == $version' CHANGELOG.json >/dev/null
            grep -q "v${DEVELOP_VERSION}" README.md
            echo "ℹ️ v$DEVELOP_VERSION 릴리스 준비가 이미 develop에 반영되어 있습니다"
          else
            CHANGELOG_PROVIDER=$(grep -A5 'changelog:' version.yml | grep 'provider:' | head -1 | sed -E 's/.*provider: *"?([a-z-]+)"?.*/\1/' || true)
            CHANGELOG_BASE_URL=$(grep -A5 'changelog:' version.yml | grep 'base_url:' | head -1 | sed -E 's/.*base_url: *"?([^" ]*)"?.*/\1/' || true)
            [ -z "$CHANGELOG_PROVIDER" ] && CHANGELOG_PROVIDER="coderabbit"

            SUMMARY_FOUND=false
            if [ "$CHANGELOG_PROVIDER" = "coderabbit" ]; then
              for attempt in $(seq 1 120); do
                PR_BODY=$(gh pr view "$RELEASE_PR" --json body --jq '.body // ""')
                if echo "$PR_BODY" | grep -q 'Summary by CodeRabbit'; then
                  printf '%s\n' "$PR_BODY" > pr_body.md
                  SUMMARY_FOUND=true
                  break
                fi
                if [ "$attempt" -eq 1 ]; then
                  gh pr comment "$RELEASE_PR" --body '@coderabbitai summary'
                fi
                echo "[$attempt/120] CodeRabbit Summary 대기 중..."
                sleep 5
              done
            fi

            if [ "$SUMMARY_FOUND" != "true" ]; then
              export CHANGELOG_PROVIDER CHANGELOG_BASE_URL GITHUB_TOKEN MODEL_API_KEY
              python3 .github/scripts/changelog_providers/ladder.py

              NOTICE=$(jq -r '.notice // ""' provider_result.json)
              if [ -n "$NOTICE" ]; then
                gh pr comment "$RELEASE_PR" --body "⚠️ changelog provider 폴백: $NOTICE"
              fi
            fi

            [ -s pr_body.md ] || { echo "❌ 릴리스 노트 생성 실패"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}" \
              --method PATCH \
              --raw-field "body=$(cat pr_body.md)" >/dev/null

            chmod +x .github/scripts/version_manager.sh .github/scripts/changelog_manager.py
            VERSION=$(./.github/scripts/version_manager.sh increment | tail -n 1)
            [ -n "$VERSION" ] || { echo "❌ 버전 증가 실패"; exit 1; }

            TODAY=$(date -u '+%Y-%m-%d')
            TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            PROJECT_TYPES=$(grep '^project_types:' version.yml | sed -E 's/.*\[([^]]*)\].*/\1/' | tr -d '" ')
            PROJECT_TYPE=$(echo "$PROJECT_TYPES" | cut -d',' -f1)

            export VERSION TODAY TIMESTAMP PROJECT_TYPES PROJECT_TYPE
            export PR_NUMBER="$RELEASE_PR"
            python3 .github/scripts/changelog_manager.py update-from-summary
            python3 .github/scripts/changelog_manager.py generate-md

            VERSION_LINE=$(grep -n '^## 최신 버전 :' README.md | head -1 | cut -d: -f1)
            [ -n "$VERSION_LINE" ] || { echo "❌ README 버전 표기를 찾을 수 없습니다"; exit 1; }
            sed -i "${VERSION_LINE}s|.*|## 최신 버전 : v${VERSION} (${TODAY})|" README.md

            gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}" \
              --method PATCH \
              --raw-field "title=🚀 Deploy $(date -u '+%Y%m%d')-v${VERSION}" >/dev/null

            git add -u
            git diff --staged --quiet && { echo "❌ 릴리스 준비 변경사항이 없습니다"; exit 1; }
            git commit -m "$(basename "$GITHUB_REPOSITORY") 버전 관리 : chore : v${VERSION} 릴리즈 버전 확정 및 릴리즈 문서 업데이트 (PR #${RELEASE_PR})"

            git fetch origin "$PREP_BRANCH" 2>/dev/null || true
            git switch -c "$PREP_BRANCH"
            git push --force-with-lease origin "HEAD:${PREP_BRANCH}"

            gh pr create \
              --base develop \
              --head "$PREP_BRANCH" \
              --title "chore : v${VERSION} 릴리스 문서 준비 (release PR #${RELEASE_PR})" \
              --body "릴리스 PR #${RELEASE_PR}의 버전·CHANGELOG·README를 준비합니다. 필수 CI 통과 후 develop에 병합됩니다." >/dev/null
            PREP_PR=$(gh pr view "$PREP_BRANCH" --json number --jq .number)

            PREP_HEAD=$(gh pr view "$PREP_PR" --json headRefOid --jq .headRefOid)
            wait_required_checks "$PREP_PR"
            gh pr merge "$PREP_PR" --merge --delete-branch --match-head-commit "$PREP_HEAD"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}" \
            --method PATCH \
            --raw-field "title=🚀 Deploy $(date -u '+%Y%m%d')-v${VERSION}" >/dev/null
          RELEASE_HEAD=$(gh pr view "$RELEASE_PR" --json headRefOid --jq .headRefOid)
          wait_required_checks "$RELEASE_PR"
          gh pr merge "$RELEASE_PR" --merge --delete-branch=false --match-head-commit "$RELEASE_HEAD"
          echo "🎉 v${VERSION} 릴리스 PR 병합 완료"

  tag-release:
    name: 릴리스 태그 생성
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃
        uses: actions/checkout@v5
        with:
          token: ${{ secrets._GITHUB_PAT_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: 버전 태그 생성
        run: |
          set -euo pipefail

          VERSION=$(python3 .github/scripts/version_manager.py get | tail -n 1)
          TAG_NAME="v${VERSION}"

          git fetch origin --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️ 태그 $TAG_NAME이 이미 존재합니다"
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "$TAG_NAME" "${{ github.sha }}"
          git push origin "$TAG_NAME"
          echo "✅ 태그 $TAG_NAME 생성 완료"
