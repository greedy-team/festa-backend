services:
  postgres:
    # The image version matches deploy/compose.yaml, but this service is isolated:
    # it has a different database, port, and named volume.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festa_perf
      POSTGRES_USER: festa_perf
      POSTGRES_PASSWORD: festa-perf-local-only
    ports:
      - "127.0.0.1:${PERF_POSTGRES_PORT:-55432}:5432"
    volumes:
      - festa-perf-postgres-data:/var/lib/postgresql/data
      - ${PERF_MIGRATIONS_DIR:-../src/main/resources/db/migration}:/migrations:ro
      - ./sql:/perf:ro
      - ./bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festa_perf -d festa_perf"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  # Never reuse deploy/compose.yaml's postgres-data volume.
  festa-perf-postgres-data:
