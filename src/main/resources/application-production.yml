# 운영용 프로파일 — main 자동 배포(A1, api.every-festa.com)가 쓴다.
# API 문서는 공통 설정의 꺼짐을 그대로 따른다.
app:
  cors:
    # 공개 프론트만 적는다. 로컬 개발과 Vercel Preview는 개발 서버(dev-api)에 붙는다.
    # CORS_ALLOWED_ORIGINS 덮어쓰기 통로가 컨테이너까지 없는 사정은 development와 같다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://every-festa.com,https://www.every-festa.com}
