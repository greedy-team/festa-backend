# 개발용 프로파일 — 로컬 실행과 develop 자동 배포가 함께 쓴다.
# 운영(production)은 프로파일별 설정이 없고 공통 설정의 꺼짐을 그대로 따른다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    # 배포 프론트와 로컬을 함께 적는다. 값이 바뀌면 리뷰를 거치도록 리터럴로 두고,
    # 급할 때만 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://every-festa.com,https://www.every-festa.com}
