spring:
  application:
    name: festa

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

# 프록시(Caddy)가 443에서 TLS를 끊고 평문 HTTP로 넘겨주므로, 이 설정이 없으면 앱은 자기가
# http로 서빙된다고 인식한다. 그러면 springdoc이 만드는 servers URL과 리다이렉트 Location이
# 전부 http가 되고, https로 열린 Swagger 화면이 http를 호출해 브라우저가 mixed content로 막는다.
# X-Forwarded-Proto 를 신뢰하는 설정이지만, 앱 포트 8080은 프록시 밖에서 닫혀 있다 (#78).
server:
  forward-headers-strategy: framework

app:
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    admin-secret: ${ADMIN_JWT_SECRET}
    admin-token-validity: PT1H
  crypto:
    aes-key: ${AES_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 로그 한 줄이 "어느 요청을, 누가" 했는지 갖게 하는 자리다. 콘솔·파일 형식이 이 자리를
# 공유하므로(spring-boot의 logback/defaults.xml — CONSOLE_LOG_PATTERN과 FILE_LOG_PATTERN이
# 둘 다 LOG_CORRELATION_PATTERN을 품는다), 형식 전체를 덮어쓰지 않고도 양쪽에 한 번에 붙는다.
#
#  - 요청 번호: AccessLogFilter가 MDC에 넣는다 (#118). 그 PR이 머지되기 전까지 이 칸은
#    `[        ]`로 비어 있다 — 자리를 미리 잡아 두는 쪽이 나중에 형식이 갈리지 않는다.
#  - 관리자: JwtAuthenticationFilter가 MDC에 넣는다 (#117). 토큰이 없는 공개 API 요청은 `-`.
#
# 두 칸을 하나로 합쳐 `%correlationId{requestId(8),admin(0)}`으로 쓸 수도 있으나 값이
# `[a1b2c3d4-festa-admin]`처럼 대시로 붙고 한쪽이 비면 `[        -festa-admin]`이 되어
# 읽기 나쁘다. 칸을 나눠 둔다.
#
# 로그를 남기는 쪽은 아무것도 하지 않는다. 줄마다 손으로 붙이면 새 로그에서 빠뜨리고,
# 무엇보다 WARN 이상만 파일에 남으므로 실패한 작업에도 자동으로 붙어야 한다.
logging:
  pattern:
    correlation: "%correlationId{requestId(8)}[%X{admin:--}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 꺼둔 것이 기본값이다. 프로파일을 지정하지 않으면 닫힌 채로 뜨므로,
# 배포 설정을 손대지 않아도 외부에 노출되지 않는다. 여는 것은 development 프로파일뿐이다.
#
# 주소는 `/docs` 아래에 둔다. 서비스 API는 `/api`를 쓰므로 문서와 API가 URL만 보고 갈린다.
# swagger-ui.path 는 진입 경로일 뿐 아니라 그 상위 디렉터리가 UI 리소스의 루트가 되므로,
# `/docs/swagger-ui.html`로 두면 화면이 `/docs/swagger-ui/index.html`에서 열린다.
springdoc:
  api-docs:
    enabled: false
    path: /docs/v3/api-docs
  swagger-ui:
    enabled: false
    path: /docs/swagger-ui.html
