spring:
  application:
    name: festa

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

# 프록시(Caddy)가 443에서 TLS를 끊고 평문 HTTP로 넘겨주므로, 이 설정이 없으면 앱은 자기가
# http로 서빙된다고 인식한다. 그러면 springdoc이 만드는 servers URL과 리다이렉트 Location이
# 전부 http가 되고, https로 열린 Swagger 화면이 http를 호출해 브라우저가 mixed content로 막는다.
# X-Forwarded-Proto 를 신뢰하는 설정이지만, 앱 포트 8080은 프록시 밖에서 닫혀 있다 (#78).
server:
  forward-headers-strategy: framework

app:
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    admin-secret: ${ADMIN_JWT_SECRET}
    admin-token-validity: PT1H
  crypto:
    aes-key: ${AES_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 로그는 두 갈래로 나간다.
#  - 화면(stdout): 도커가 받아 파일로 모은다. 전부 담기지만 컨테이너에 딸려 있어
#    배포로 컨테이너가 교체되면 사라진다. 상한은 deploy/compose.yaml의 logging이 건다.
#  - 파일: app-logs 볼륨에 남아 배포를 넘겨 살아남는다. 그래서 오래 보존할 가치가 있는
#    WARN 이상만 담는다. 접속 기록 같은 INFO까지 넣으면 이 볼륨이 금방 밀려난다.
#
# total-size-cap 기본값이 0(무제한)이고 max-history 없이는 무시되므로 둘 다 적는다.
# 다만 두 한도 모두 상시로 걸리지 않는다. 오래된 아카이브 정리는 일 단위 롤오버 시점에만
# 돌고, 하루 안에서 max-file-size로 여러 번 갈리는 동안에는 총량을 보지 않는다. 그래서
# 200MB는 hard cap이 아니라 일 경계에서 맞춰지는 상한이다 — 하루치가 몰리면 넘겼다가
# 다음 날 되돌아온다. 파일에 WARN 이상만 담으므로 그 초과분은 크지 않다.
# max-history: 90도 같은 이유로 "90일 보존"이 아니다. 일 경계에서 90주기보다 오래된 것을
# 지운다는 뜻이고 총량 캡이 먼저 걸리면 더 짧아지므로, 보존을 기간으로 약속하지 않는다.
# 오래된 아카이브는 Boot 기본 설정대로 .gz로 압축된다.
#
# 파일 경로(logging.file.name)는 여기에 두지 않는다. 절대 경로를 적으면 로컬과 CI도
# 그 경로를 만들려 들어 개발기에 엉뚱한 디렉터리가 생기고, 쓰기 권한이 없는 리눅스
# 러너에서는 매 실행마다 logback 오류가 찍힌다. 경로는 볼륨을 붙이는 쪽과 짝이므로
# deploy/compose.yaml이 LOGGING_FILE_NAME으로 준다 — 안 주면 파일 로그가 꺼진다.
logging:
  threshold:
    console: INFO
    file: WARN
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 90
      total-size-cap: 200MB
  # AccessLogFilter가 MDC에 넣는 요청 번호를 로그에 드러낸다. 이 자리는 콘솔·파일 형식이
  # 공유하므로, 형식 전체를 덮어쓰지 않고도 양쪽에 한 번에 붙는다.
  pattern:
    correlation: "%correlationId{requestId(8)}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 꺼둔 것이 기본값이다. 프로파일을 지정하지 않으면 닫힌 채로 뜨므로,
# 배포 설정을 손대지 않아도 외부에 노출되지 않는다. 여는 것은 development 프로파일뿐이다.
#
# 주소는 `/docs` 아래에 둔다. 서비스 API는 `/api`를 쓰므로 문서와 API가 URL만 보고 갈린다.
# swagger-ui.path 는 진입 경로일 뿐 아니라 그 상위 디렉터리가 UI 리소스의 루트가 되므로,
# `/docs/swagger-ui.html`로 두면 화면이 `/docs/swagger-ui/index.html`에서 열린다.
springdoc:
  api-docs:
    enabled: false
    path: /docs/v3/api-docs
  swagger-ui:
    enabled: false
    path: /docs/swagger-ui.html
