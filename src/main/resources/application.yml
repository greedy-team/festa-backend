spring:
  application:
    name: festa

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

app:
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    admin-secret: ${ADMIN_JWT_SECRET}
    admin-token-validity: PT1H
  crypto:
    aes-key: ${AES_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 꺼둔 것이 기본값이다. 프로파일을 지정하지 않으면 닫힌 채로 뜨므로,
# 배포 설정을 손대지 않아도 외부에 노출되지 않는다. 여는 것은 development 프로파일뿐이다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
