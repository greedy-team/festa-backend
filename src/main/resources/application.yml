spring:
  application:
    name: festa

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

app:
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    admin-secret: ${ADMIN_JWT_SECRET}
    admin-token-validity: PT1H
  crypto:
    aes-key: ${AES_KEY}
