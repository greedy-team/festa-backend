# 데이터소스도 사람이 UI에서 만들지 않는다 (DEC-0213).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: festa-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # UI에서 고쳐도 다음 기동에 프로비저닝 값으로 되돌아온다. 원본은 이 파일이다.
    editable: false
    jsonData:
      # 스크랩 간격과 맞춘다. 대시보드의 $__rate_interval 계산이 이 값을 쓴다.
      timeInterval: 15s
