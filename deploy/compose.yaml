# 앱은 blue/green 두 서비스로 나뉜다. 한 번에 한 색만 뜨고(개발) 또는 잠깐 둘 다 뜬다(운영).
# 트래픽을 받는 색은 compose가 아니라 서버의 upstream/active.caddy가 정한다 — CD가 덮지 않는 서버 상태다.
# 두 색은 이미지·루프백 포트·로그 파일 이름만 다르고 나머지 설정은 아래 앵커 한 벌을 공유한다.
x-app-environment: &app-environment
  # 값이 비어 있으면 프로파일 없이 뜨고 API 문서는 꺼진다.
  # 다만 develop 자동 배포는 development로 뜨므로 실제 배포에서는 켜져 있다 —
  # 저장소가 공개라 API 표면을 가릴 실익이 없어 그대로 둔다.
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
  DB_URL: ${DB_URL:?DB_URL is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  AES_KEY: ${AES_KEY:?AES_KEY is required}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
  ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  # 텔레메트리 스위치. LOGGING_FILE_NAME처럼 서버에서만 켠다 — 로컬과 CI는 compose를 쓰지 않는다.
  # 끌 때는 "false"로 바꾼다. URL 줄을 비우지 않는다. 빈 문자열은 기본값 true로 바인딩된다.
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: https://otlp-gateway-prod-ap-northeast-0.grafana.net/otlp/v1/metrics
  # 텔레메트리는 앱이 뜨는 데 필요한 값이 아니라 선택값이다 (ISS-0013 규칙: :? 는 앱이 못 뜨는 값에만).
  # :? 로 두면 프로덕션 첫 배포와 롤백 분기가 관측 비밀 하나 때문에 막힌다 (#47 함정).
  GRAFANA_OTLP_AUTH: ${GRAFANA_OTLP_AUTH:-}
  # 파일 로그를 켜는 스위치이자 그 경로다. 아래 app-logs 볼륨이 붙는 자리와 같아야 한다.
  # 색마다 파일 이름이 달라야 두 앱이 같은 파일을 돌려쓰지 않는다 — 색별로 덮어쓴다.
  LOGGING_FILE_NAME: /app/logs/festa.log

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is required}
  # 배포가 먼저 pull한다. 롤백은 인증·레지스트리 없이 로컬 정상 이미지를 쓴다.
  pull_policy: never
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  # 기본 10초는 Spring Boot의 graceful shutdown(최대 30초)보다 짧아 처리 중 요청이 끊긴다.
  # 옛 색을 멈출 때 진행 중 요청을 마무리할 시간을 준다.
  stop_grace_period: 40s
  volumes:
    - app-logs:/app/logs
  # 화면(stdout)으로 나가는 몫이다. 접속 기록까지 전부 담기지만 컨테이너에 딸려 있어
  # 배포로 컨테이너가 교체되면 사라진다. 오래 남겨야 하는 것은 app-logs 볼륨이 맡는다.
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: festa
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 루프백에만 묶는다. 앞단 caddy는 compose 네트워크로 app-<색>:8080에 닿고,
  # 서버 자신의 확인과 되돌리기도 localhost의 색별 포트로 닿는다. 인터넷에서만 못 닿는다.
  app-blue:
    <<: *app
    environment:
      <<: *app-environment
      LOGGING_FILE_NAME: /app/logs/festa-blue.log
    ports:
      - "127.0.0.1:8081:8080"

  app-green:
    <<: *app
    environment:
      <<: *app-environment
      LOGGING_FILE_NAME: /app/logs/festa-green.log
    ports:
      - "127.0.0.1:8082:8080"

  # TLS 종단. Cloudflare가 DNS 전용(회색 구름)이라 앞단에서 대신 끊어주지 않는다.
  # depends_on을 두지 않는다 — 어느 색이 뜰지는 배포 시점에 정해지고, 앞단은 앱보다
  # 먼저 떠 있어도 된다(그동안 502를 낼 뿐이다).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Caddyfile의 사이트 주소. 비밀이 아니라 GitHub Environment Variable이 app.env로 넘어온다.
      API_DOMAINS: ${API_DOMAINS:?API_DOMAINS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 트래픽을 받는 색이 적힌 서버 상태. 배포는 이 파일만 바꾸고 caddy reload로 전환한다.
      # CD가 덮지 않으므로 서버가 재부팅돼 Caddy가 다시 떠도 같은 색을 본다.
      - ./upstream:/etc/caddy/upstream:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 관측 스택 (DEC-0211) ───────────────────────────────────────────────────
  # 넷 다 profiles 뒤에 있다. CD는 서비스를 이름으로 지목해 띄우므로
  # (`up -d postgres caddy`, `up -d app-<색>`) 프로파일을 켜지 않는 한 이 넷은 뜨지 않는다.
  # 개발(E2)은 1GB라 이 스택이 들어가지 않는다 — 운영에서만 올린다:
  #   docker compose --env-file app.env --profile monitoring up -d
  #
  # 어느 것도 인터넷에 열지 않는다 (DEC-0214·DEC-0215). exporter와 prometheus는
  # compose 네트워크 안에서만 닿고, grafana만 루프백에 묶는다.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 시간과 크기를 둘 다 걸고 먼저 걸리는 쪽이 이긴다. 2026-09-18 실측 기준
      # 약 17MB/일이라 180일에 3.1GB이고, `/`의 여유 43GB 중 7%다.
      # size는 안전망이다 — 시리즈 추정이 네 배 빗나가도 오래된 것부터 지워진다.
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=12GB
      - --web.enable-lifecycle
    volumes:
      # 파일 하나가 아니라 디렉터리를 붙인다. 단일 파일 bind mount는 inode를 묶어서,
      # CD의 tar가 파일을 교체하면 컨테이너가 옛 inode를 계속 본다 — 설정을 보내고
      # SIGHUP까지 보내도 다시 읽는 내용이 옛것이라 반영되지 않는다.
      # 2026-09-18 운영에서 실제로 겪었다: reloadConfigSuccess=true인데 job이 안 늘었다.
      # 같은 배포의 ./grafana/dashboards는 디렉터리라 곧바로 반영됐다 — 그 대조가 증거다.
      # ISS-0154가 Caddyfile에서 겪은 것과 같은 함정이다.
      # 이미지의 /etc/prometheus에는 prometheus.yml 하나뿐이라 가려지는 것이 없다(실측).
      # 4단계에서 알림 규칙 파일이 늘어도 이 마운트 하나로 따라온다.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 호스트를 보려면 호스트의 /proc·/sys·/ 가 필요하다. 전부 읽기 전용이다.
  # 알려진 한계: 네트워크 인터페이스 통계는 net 네임스페이스를 따라가므로 이 컨테이너의
  # 것이 보인다. CPU·메모리·디스크 I/O·파일시스템·load는 procfs 기반이라 호스트 값이
  # 정확히 나온다. 네트워크까지 보려면 network_mode: host가 필요한데 그러면 포트를
  # 호스트에 열게 되어 DEC-0214와 부딪힌다. 필요가 확인되면 따로 판단한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 앱 계정을 재사용하지 않는다 — 권한 범위와 비밀 회전 주기가 다르다.
  # 서버에서 pg_monitor 롤을 가진 전용 계정을 만들고 app.env에 DSN을 넣는다.
  # 값이 비면 이 컨테이너만 뜨지 못한다. :? 를 쓰지 않는 이유는 DEC-0185와 같다 —
  # compose config는 프로파일 뒤의 서비스까지 평가하므로 CD 전체가 그 자리에서 죽는다.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 루프백에만 묶는다 (DEC-0215). 인터넷에서 보면 존재하지 않는다.
  # 볼 때는 노트북에서 터널을 연다: ssh -N -L 3000:127.0.0.1:3000 <user>@<A1>
  # ⚠ GRAFANA_ADMIN_PASSWORD 를 app.env에 넣지 않으면 Grafana가 admin/admin으로 뜬다.
  #    첫 기동 전에 반드시 넣는다 (커밋 금지).
  grafana:
    image: grafana/grafana:13.2.2
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 터널로 http://localhost:3000 을 열기 때문에 root_url도 그 주소여야 한다.
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  # 관측 스택의 상태. prometheus-data가 시계열 전체이므로 이 볼륨을 지우면 과거
  # 데이터가 사라진다(보존 180일). grafana-data는 사용자·세션만 담는다 —
  # 대시보드와 데이터소스의 원본은 저장소의 provisioning이다(DEC-0213).
  prometheus-data:
  grafana-data:
  # 발급받은 인증서가 여기 남는다. 이 볼륨이 없으면 재배포마다 재발급을 시도하고,
  # develop 푸시마다 배포되므로 며칠 만에 Let's Encrypt 발급 한도에 걸린다.
  caddy-data:
  caddy-config:
  # 앱이 남기는 파일 로그(WARN 이상)가 여기 쌓인다. 도커 로그와 달리 컨테이너 교체를
  # 넘어 살아남으므로, 배포 전에 무슨 일이 있었는지를 이 볼륨만 볼 수 있다.
  # 이름 있는 볼륨이라 첫 생성 때 이미지의 /app/logs 소유권을 물려받는다 — 호스트
  # 디렉터리를 직접 붙이면 root 소유가 되어 비root로 도는 앱이 기동에 실패한다.
  # 두 색이 같은 볼륨을 공유하되 파일 이름이 달라 서로 덮어쓰지 않는다.
  app-logs:
