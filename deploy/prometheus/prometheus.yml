# 관측 스택의 수집 설정 (DEC-0211 / DEC-0213).
# 이 파일이 원본이다 — Prometheus UI가 아니라 저장소가 스크랩 대상을 소유한다.
#
# 앱 스크랩은 3단계에서 들어왔다 (#215). Caddy 차단(DEC-0214)이 v0.0.8로 운영에 먼저 반영된
# 뒤에 노출했다. 앱의 OTLP push는 그대로 둔다 — Grafana Cloud의 합성 체크와 Discord 알림이
# 거기 살아 있고(DEC-0212), 중단 시점은 DOC-0018 열린 질문 ⑥으로 3단계 검증 후에 정한다.
global:
  # 현행 OTLP push의 60초보다 4배 촘촘하다. blue/green 전환처럼 수십 초 만에 끝나는
  # 사건을 보려면 60초로는 부족하다.
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    # 개발(E2)은 이 스택을 쓰지 않는다(1GB라 안 들어간다). 이 스택의 데이터는 전부 운영이다.
    deployment_environment_name: production

scrape_configs:
  # 자기 자신. Prometheus가 살아 있으나 이상한 경우(TSDB 쓰기 실패·WAL)를 잡는 재료다.
  # 프로세스가 통째로 죽은 경우는 못 잡는다 — dead-man을 두지 않기로 했고(DEC-0212),
  # 그 자리는 주 1회 사람 점검이 맡는다.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 호스트. 커뮤니티 대시보드 1860이 job="node"를 기본값으로 기대한다.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # 이름을 postgres-exporter로 맞춘다. 커뮤니티 대시보드 12485가
  # job="postgres-exporter"를 하드코딩해 조회하므로, 다르면 Instance 변수가 비어
  # 대시보드가 통째로 빈다. 1860(node)은 job 변수를 동적으로 읽어 이름에 구애받지 않는다.
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # 앱. job 이름은 OTLP 경로가 쓰던 festa를 그대로 이어받는다 (DEC-0184).
  #
  # 두 색을 다 적는다. 스크랩이 instance="app-blue:8080" / "app-green:8080"을 붙여 주므로
  # 어느 색이 낸 값인지 공짜로 갈린다 — OTLP 경로에는 instance 라벨이 아예 없었다.
  #
  # ⚠️ 비활성 색은 항상 down이다. blue/green은 한 번에 한 색만 살아 있고 CD가 옛 색 컨테이너를
  # 지우므로, 그쪽 타깃은 DNS부터 실패한다. 이것은 결함이 아니라 설계된 상태다.
  # 따라서 알림을 붙일 때 up{job="festa"} == 0 을 쓰면 안 된다 — 평시에도 늘 참이다.
  # 「앱이 죽었다」는 sum(up{job="festa"}) == 0 으로 써야 한다. 전환 중에는 잠깐 둘 다 1이다.
  - job_name: festa
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-blue:8080", "app-green:8080"]
